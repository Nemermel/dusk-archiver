[package]
name = "dusk-archiver"
version = "0.1.0"
edition = "2021"
description = "Offline Dusk Packed Atlas (.dpa) compiler and content archiver"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
lz4_flex = "0.11"
mlua = { version = "0.10", features = ["luajit"] }
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
